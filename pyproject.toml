[project]
name = "sistema-intelligence"
version = "1.0.0"
description = "Entrega final AI Engineering: RAG híbrido + agentes con Supervisor + API FastAPI asíncrona + checkpointer Redis + trazas en Arize Phoenix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "arize-phoenix-otel>=0.17.2",
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "langchain-core>=1.6.10",
    "langchain-openai>=1.7.1",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.15",
    "langgraph-checkpoint-redis>=0.5.2",
    "openinference-instrumentation-langchain>=0.1.79",
    "pinecone[asyncio]>=7.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.11.0",
    "rank-bm25>=0.2.2",
    "redis>=8.1.0",
    "tiktoken>=0.14.0",
    "uvicorn[standard]>=0.54.0",
]

# No es un paquete instalable: el código vive en `app/` y se importa desde la raíz.
[tool.uv]
package = false

[dependency-groups]
dev = [
    "fakeredis>=2.39.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = [
    # Aviso interno de langgraph-checkpoint-redis (no es de nuestro código).
    "ignore:get_async_redis_connection will become a coroutine:DeprecationWarning",
]
log_level = "WARNING"

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["E501"]  # las líneas largas las acota el formateo, no el linter
